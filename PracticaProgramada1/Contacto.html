<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto - Clínica Médica</title>
  <link rel="stylesheet" href="styles.css">
  <script>
    // Función para manejar el envío del formulario
    function enviarFormulario(event) {
      // Prevenir el comportamiento por defecto del formulario
      event.preventDefault();

      // Mostrar un mensaje de confirmación
      alert('Su formulario ha sido enviado');

      // Redirigir al usuario a la página de inicio
      window.location.href = 'index.html';
    }
  </script>
</head>
<body>
  <!-- Barra de Navegación -->
  <nav>
    <ul>
      <li><a href="index.html">Inicio</a></li>
      <li><a href="servicios.html">Servicios</a></li>
      <li><a href="perfil_doctor.html">Perfil del Doctor</a></li>
      <li><a href="contacto.html">Contacto</a></li>
    </ul>
  </nav>

  <!-- Sección de Contacto -->
  <section class="contacto">
    <h1>Contacto</h1>
    <p>Para agendar una cita o para más información, por favor complete el siguiente formulario:</p>
    <form id="formulario-contacto" onsubmit="enviarFormulario(event)">
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" name="nombre" required>

      <label for="correo">Correo Electrónico:</label>
      <input type="email" id="correo" name="correo" required>

      <label for="mensaje">Mensaje:</label>
      <textarea id="mensaje" name="mensaje" rows="4" required></textarea>

      <button type="submit">Enviar</button>
    </form>
  </section>
</body>
</html>
