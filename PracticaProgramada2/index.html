<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Cargas Sociales - Costa Rica</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h2>Calculadora de Cargas Sociales</h2>
        <label for="salario">Ingrese su salario bruto:</label>
        <input type="number" id="salario" placeholder="Ejemplo: 1000000">
        <button onclick="calcularDeducciones()">Calcular</button>

        <div id="resultados">
            <p>Cargas Sociales: <span id="cargas-sociales">₡0.00</span></p>
            <p>Impuesto sobre la Renta: <span id="impuesto-renta">₡0.00</span></p>
            <p><strong>Salario Neto: <span id="salario-neto">₡0.00</span></strong></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
